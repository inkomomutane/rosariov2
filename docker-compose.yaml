
services:
  php:
    image: mutane/telemed:latest

    environment:
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "true"
      HEALTHCHECK_PATH: "/up"
      SSL_MODE: "off"
      LOG_OUTPUT_LEVEL: "debug"
      APP_URL: "https://telemed.tikonta.com"
      ASSET_URL: "https://telemed.tikonta.com"

    networks:
      - traefik_public

    volumes:
      - "./.telemed.env:/var/www/html/.env"

    deploy:
      replicas: 3

      update_config:
        failure_action: rollback
        parallelism: 1
        delay: 5s
        order: start-first

      rollback_config:
        parallelism: 1
        order: stop-first

      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s

      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_public"

        # HTTPS
        - "traefik.http.routers.php.rule=Host(`telemed.tikonta.com`)"
        - "traefik.http.routers.php.entrypoints=websecure"
        - "traefik.http.routers.php.tls=true"
        - "traefik.http.routers.php.tls.certresolver=le"
        - "traefik.http.routers.php.service=php"

        # Backend
        - "traefik.http.services.php.loadbalancer.server.port=80"
        - "traefik.http.services.php.loadbalancer.server.scheme=http"

        # HTTP to HTTPS
        - "traefik.http.routers.php-http.rule=Host(`telemed.tikonta.com`)"
        - "traefik.http.routers.php-http.entrypoints=web"
        - "traefik.http.routers.php-http.middlewares=php-https-redirect"
        - "traefik.http.routers.php-http.service=php"
        - "traefik.http.middlewares.php-https-redirect.redirectscheme.scheme=https"

networks:
  traefik_public:
    external: true
